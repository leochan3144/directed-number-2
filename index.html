<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addition and substraction of directed number</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8fafc;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .number-line-container {
            position: relative;
            width: 100%;
            height: 140px;
            margin-top: 10px;
        }

        .axis-line {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #334155;
            border-radius: 2px;
        }

        .tick-mark {
            position: absolute;
            top: 96px;
            width: 2px;
            height: 12px;
            background-color: #334155;
            transform: translateX(-50%);
        }
        
        .tick-mark.major {
            top: 92px;
            height: 20px;
            width: 3px;
        }

        .tick-mark.zero {
            background-color: #ef4444;
        }

        .tick-label {
            position: absolute;
            top: 116px;
            transform: translateX(-50%);
            font-size: 0.75rem;
            font-weight: 800;
            color: #475569;
        }
        
        .tick-label.zero {
            color: #ef4444;
            font-size: 1rem;
        }

        .drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100px;
            background-color: rgba(241, 245, 249, 0.6);
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .drop-zone.drag-over {
            background-color: rgba(187, 247, 208, 0.6);
            border-color: #22c55e;
        }

        .numpad-btn {
            background-color: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #334155;
            padding: 12px;
            box-shadow: 0 4px 0 #cbd5e1;
            transition: all 0.1s;
            cursor: pointer;
            user-select: none;
        }
        .numpad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #cbd5e1;
        }
        .numpad-btn.action {
            background-color: #f1f5f9;
            color: #475569;
        }
        .numpad-btn.submit {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 4px 0 #1d4ed8;
        }
        .numpad-btn.submit:active {
            box-shadow: 0 0 0 #1d4ed8;
        }

        /* Fixed Static Star Display */
        .star {
            position: fixed;
            color: #fbbf24;
            user-select: none;
            pointer-events: none;
            z-index: 9999;
            filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.8));
        }

        .vector-body-pos { background-color: #3b82f6; }
        .vector-head-pos { border-left-color: #3b82f6; }
        .vector-body-neg { background-color: #ef4444; }
        .vector-head-neg { border-right-color: #ef4444; }
        
        .vector-arrow {
            position: relative;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="text-slate-800">

<div class="max-w-5xl mx-auto p-4 flex flex-col items-center">
    
    <header class="w-full flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-xl md:text-2xl font-black text-slate-700 mb-4 md:mb-0 text-center md:text-left">
            Addition and substraction of directed number
        </h1>
        
        <div class="flex flex-col gap-2">
            <div class="flex gap-2 bg-slate-100 p-1 rounded-xl">
                <button id="lvl1-btn" onclick="setLevel(1)" class="px-6 py-2 rounded-lg font-bold bg-white shadow text-blue-600 transition-colors">Level 1 (2 Terms)</button>
                <button id="lvl2-btn" onclick="setLevel(2)" class="px-6 py-2 rounded-lg font-bold text-slate-500 hover:text-blue-600 transition-colors">Level 2 (3 Terms)</button>
            </div>
            <div class="flex gap-2 justify-center">
                <div id="score-card-1" class="bg-blue-50 text-blue-700 font-bold px-4 py-1 rounded-lg text-sm border-2 border-blue-200">
                    Lvl 1 Score: <span id="score-1">0</span>
                </div>
                <div id="score-card-2" class="bg-slate-50 text-slate-500 font-bold px-4 py-1 rounded-lg text-sm border-2 border-slate-200 opacity-70">
                    Lvl 2 Score: <span id="score-2">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="w-full bg-white rounded-3xl shadow-lg border border-slate-200 p-4 md:p-8 flex flex-col items-center min-h-[600px]">
        
        <div class="text-center mb-6">
            <h2 class="text-lg font-bold text-slate-400 uppercase tracking-widest mb-2">Solve</h2>
            <div id="question-display" class="text-3xl md:text-5xl font-black text-slate-800 tracking-wider bg-slate-50 px-8 py-4 rounded-2xl border-2 border-slate-100 shadow-inner">
                <!-- Dynamically populated -->
            </div>
        </div>

        <div class="w-full max-w-4xl bg-slate-50 rounded-2xl p-4 border-2 border-dashed border-slate-300 mb-6 z-20">
            <h3 class="text-center text-slate-500 font-bold mb-3 text-sm uppercase">Vector Bank (Drag required vectors)</h3>
            <div id="vector-bank" class="flex flex-wrap justify-center gap-4 min-h-[40px] items-center">
                <!-- Vectors generated by JS -->
            </div>
        </div>

        <div class="w-full max-w-4xl relative mb-4 px-4 z-10 overflow-x-auto">
            <div class="min-w-[600px] number-line-container" id="number-line-container">
                <div class="drop-zone flex items-center justify-center text-slate-400 font-bold" id="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                    Drag all correct vectors here in order
                </div>
                <div class="axis-line"></div>
                <!-- Ticks generated by JS -->
            </div>
        </div>

        <div id="input-section" class="w-full max-w-sm flex flex-col items-center hidden transition-opacity duration-300 mt-4">
            <div class="w-full bg-slate-800 text-white text-4xl font-mono font-bold rounded-xl p-4 mb-4 text-right shadow-inner min-h-[76px] flex items-center justify-end overflow-hidden border-4 border-slate-700" id="input-display">
            </div>
            
            <div class="grid grid-cols-3 gap-3 w-full mb-4">
                <button class="numpad-btn" onclick="inputNum('1')">1</button>
                <button class="numpad-btn" onclick="inputNum('2')">2</button>
                <button class="numpad-btn" onclick="inputNum('3')">3</button>
                <button class="numpad-btn" onclick="inputNum('4')">4</button>
                <button class="numpad-btn" onclick="inputNum('5')">5</button>
                <button class="numpad-btn" onclick="inputNum('6')">6</button>
                <button class="numpad-btn" onclick="inputNum('7')">7</button>
                <button class="numpad-btn" onclick="inputNum('8')">8</button>
                <button class="numpad-btn" onclick="inputNum('9')">9</button>
                <button class="numpad-btn action" onclick="inputNum('-')">-</button>
                <button class="numpad-btn" onclick="inputNum('0')">0</button>
                <button class="numpad-btn action" onclick="clearInput()">C</button>
            </div>
            
            <button class="numpad-btn submit w-full py-4 text-2xl uppercase tracking-wider" onclick="checkAnswer()">Submit</button>
        </div>

        <!-- Feedback Message Box -->
        <div id="feedback-modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl border-4 border-white">
                <h2 id="feedback-title" class="text-5xl font-black mb-4"></h2>
                <p id="feedback-msg" class="text-xl text-slate-600 mb-8 font-bold"></p>
                <button onclick="nextQuestion()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 text-2xl">
                    Continue
                </button>
            </div>
        </div>

        <!-- Win Screen Overlay -->
        <div id="win-overlay" class="hidden fixed inset-0 bg-white/80 z-[9000] flex flex-col items-center justify-center backdrop-blur-sm">
            <div class="bg-white p-8 rounded-3xl shadow-2xl border-4 border-yellow-400 text-center max-w-md w-full mx-4 z-[9001]">
                <h1 class="text-4xl font-black text-yellow-500 mb-4">MASTERED!</h1>
                <p class="text-lg text-slate-700 font-bold mb-8">You scored 10 marks in BOTH levels!</p>
                <button onclick="resetGame()" class="bg-blue-500 hover:bg-blue-600 text-white font-black py-4 px-8 rounded-xl shadow-lg transition-all active:scale-95 text-xl w-full">
                    Play Again
                </button>
            </div>
        </div>

    </main>
</div>

<script>
    const MIN_VAL = -15;
    const MAX_VAL = 15;
    const TOTAL_RANGE = MAX_VAL - MIN_VAL;

    const state = {
        level: 1,
        scores: { 1: 0, 2: 0 },
        currentQuestion: {
            terms: [], // { displayStr: string, vectorValue: number }
            finalAnswer: 0
        },
        bankVectors: [], 
        placedVectors: [], 
        inputValue: "",
        audioCtx: null
    };

    const DOM = {
        numberLine: document.getElementById('number-line-container'),
        dropZone: document.getElementById('drop-zone'),
        vectorBank: document.getElementById('vector-bank'),
        question: document.getElementById('question-display'),
        inputSection: document.getElementById('input-section'),
        inputDisplay: document.getElementById('input-display'),
        modal: document.getElementById('feedback-modal'),
        modalTitle: document.getElementById('feedback-title'),
        modalMsg: document.getElementById('feedback-msg'),
        winOverlay: document.getElementById('win-overlay')
    };

    function initAudio() {
        if (!state.audioCtx) {
            state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (state.audioCtx.state === 'suspended') {
            state.audioCtx.resume();
        }
    }

    function playCorrectSound() {
        if (!state.audioCtx) return;
        const osc = state.audioCtx.createOscillator();
        const gainNode = state.audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, state.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, state.audioCtx.currentTime + 0.1);
        
        gainNode.gain.setValueAtTime(0, state.audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.5, state.audioCtx.currentTime + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + 0.3);
        
        osc.connect(gainNode);
        gainNode.connect(state.audioCtx.destination);
        osc.start();
        osc.stop(state.audioCtx.currentTime + 0.3);
    }

    function playWrongSound() {
        if (!state.audioCtx) return;
        const osc = state.audioCtx.createOscillator();
        const gainNode = state.audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, state.audioCtx.currentTime);
        
        gainNode.gain.setValueAtTime(0, state.audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.3, state.audioCtx.currentTime + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + 0.4);
        
        osc.connect(gainNode);
        gainNode.connect(state.audioCtx.destination);
        osc.start();
        osc.stop(state.audioCtx.currentTime + 0.4);
    }

    function init() {
        renderNumberLine();
        setLevel(1);
        
        // Init audio on first interaction
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('dragstart', initAudio, { once: true });
    }

    function setLevel(lvl) {
        state.level = lvl;
        const btn1 = document.getElementById('lvl1-btn');
        const btn2 = document.getElementById('lvl2-btn');
        const sc1 = document.getElementById('score-card-1');
        const sc2 = document.getElementById('score-card-2');
        
        if (lvl === 1) {
            btn1.className = "px-6 py-2 rounded-lg font-bold bg-white shadow text-blue-600 transition-colors";
            btn2.className = "px-6 py-2 rounded-lg font-bold text-slate-500 hover:text-blue-600 transition-colors bg-transparent shadow-none";
            sc1.classList.replace('bg-slate-50', 'bg-blue-50');
            sc1.classList.replace('text-slate-500', 'text-blue-700');
            sc1.classList.remove('opacity-70');
            sc2.classList.replace('bg-blue-50', 'bg-slate-50');
            sc2.classList.replace('text-blue-700', 'text-slate-500');
            sc2.classList.add('opacity-70');
        } else {
            btn2.className = "px-6 py-2 rounded-lg font-bold bg-white shadow text-blue-600 transition-colors";
            btn1.className = "px-6 py-2 rounded-lg font-bold text-slate-500 hover:text-blue-600 transition-colors bg-transparent shadow-none";
            sc2.classList.replace('bg-slate-50', 'bg-blue-50');
            sc2.classList.replace('text-slate-500', 'text-blue-700');
            sc2.classList.remove('opacity-70');
            sc1.classList.replace('bg-blue-50', 'bg-slate-50');
            sc1.classList.replace('text-blue-700', 'text-slate-500');
            sc1.classList.add('opacity-70');
        }
        startNewQuestion();
    }

    function getRandomInt(min, max) {
        let val = 0;
        while (val === 0) { // Avoid zero for terms
            val = Math.floor(Math.random() * (max - min + 1)) + min;
        }
        return val;
    }

    function formatFirstTermStr(val) {
        const r = Math.random();
        if (val > 0) {
            return r > 0.5 ? `+${val}` : `${val}`;
        } else {
            return r > 0.5 ? `+(${val})` : `${val}`;
        }
    }

    function generateQuestionData() {
        let valid = false;
        let termsData = [];
        
        while (!valid) {
            termsData = [];
            let currentSum = 0;
            let numTerms = state.level === 1 ? 2 : 3;
            
            // Generate First Term
            let val1 = getRandomInt(-9, 9);
            currentSum += val1;
            termsData.push({
                displayStr: formatFirstTermStr(val1),
                vectorValue: val1
            });

            // Generate Subsequent Terms
            let intermediateValid = true;
            for (let i = 1; i < numTerms; i++) {
                let op = Math.random() > 0.5 ? '+' : '-';
                let rawVal = getRandomInt(-9, 9);
                let vectorVal = (op === '+') ? rawVal : -rawVal;
                
                let signStr = rawVal > 0 ? '+' : '';
                let displayStr = `${op}(${signStr}${rawVal})`;
                
                currentSum += vectorVal;
                termsData.push({
                    displayStr: displayStr,
                    vectorValue: vectorVal
                });

                if (currentSum < MIN_VAL || currentSum > MAX_VAL) {
                    intermediateValid = false;
                    break;
                }
            }
            
            if (intermediateValid && currentSum >= MIN_VAL && currentSum <= MAX_VAL) {
                valid = true;
            }
        }

        return {
            terms: termsData,
            finalAnswer: termsData.reduce((sum, t) => sum + t.vectorValue, 0)
        };
    }

    function startNewQuestion() {
        state.currentQuestion = generateQuestionData();
        state.placedVectors = [];
        clearInput();
        DOM.inputSection.classList.add('hidden'); 
        
        updateQuestionDisplay();
        generateBankVectors();
        renderPlacedVectors();
    }

    function updateQuestionDisplay() {
        let str = state.currentQuestion.terms.map(t => t.displayStr).join('');
        DOM.question.textContent = str;
    }

    function createVectorArrowHTML(value, isBank = false) {
        const isPos = value > 0;
        const bodyClass = isPos ? 'vector-body-pos' : 'vector-body-neg';
        const headClass = isPos ? 'vector-head-pos' : 'vector-head-neg';
        const sign = isPos ? '+' : '';
        const displayVal = sign + value;

        if (isPos) {
            return `
                <div class="absolute left-0 right-[12px] h-6 ${bodyClass} rounded-l-sm opacity-95"></div>
                <div class="absolute right-0 w-0 h-0 border-y-[12px] border-y-transparent border-l-[12px] ${headClass} opacity-95"></div>
                <span class="relative z-10 text-white font-black text-xs pointer-events-none drop-shadow-md whitespace-nowrap px-1">${displayVal}</span>
            `;
        } else {
            return `
                <div class="absolute left-[12px] right-0 h-6 ${bodyClass} rounded-r-sm opacity-95"></div>
                <div class="absolute left-0 w-0 h-0 border-y-[12px] border-y-transparent border-r-[12px] ${headClass} opacity-95"></div>
                <span class="relative z-10 text-white font-black text-xs pointer-events-none drop-shadow-md whitespace-nowrap px-1">${displayVal}</span>
            `;
        }
    }

    function createArrowDOM(vecData, isBank) {
        const el = document.createElement('div');
        el.className = `flex items-center justify-center cursor-grab active:cursor-grabbing hover:brightness-110 transition-all`;
        el.id = vecData.id;
        el.innerHTML = createVectorArrowHTML(vecData.value, isBank);
        
        // Z-Index calculation: Smaller vectors on top
        const calculatedZIndex = 100 - Math.abs(vecData.value);
        el.style.zIndex = calculatedZIndex;
        
        el.draggable = true;
        el.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', vecData.id);
            setTimeout(() => el.style.opacity = '0.5', 0);
        });
        el.addEventListener('dragend', () => el.style.opacity = '1');
        
        el.addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (isBank) moveToDropZone(vecData.id);
            else returnToBank(vecData.id);
        });

        if (isBank) {
            el.style.position = 'relative';
            const visualWidth = Math.max(50, Math.abs(vecData.value) * 15);
            el.style.width = `${visualWidth}px`;
            el.style.height = '24px';
        } else {
            el.style.position = 'absolute';
            // Align visually near the axis
            el.style.top = '72px'; // Axis is at 100px. Arrow is 24px high.
            el.style.height = '24px';
        }

        return el;
    }

    function generateBankVectors() {
        state.bankVectors = [];
        let idCounter = 1;
        state.currentQuestion.terms.forEach(term => {
            state.bankVectors.push({ id: `vec-${idCounter++}`, value: term.vectorValue });
            state.bankVectors.push({ id: `vec-${idCounter++}`, value: -term.vectorValue }); // Distractor
        });
        state.bankVectors.sort(() => Math.random() - 0.5);
        refreshBankUI();
    }

    function renderNumberLine() {
        for (let i = MIN_VAL; i <= MAX_VAL; i++) {
            const percent = ((i - MIN_VAL) / TOTAL_RANGE) * 100;
            const tick = document.createElement('div');
            tick.className = `tick-mark ${i % 5 === 0 ? 'major' : ''} ${i === 0 ? 'zero' : ''}`;
            tick.style.left = `${percent}%`;
            DOM.numberLine.appendChild(tick);

            if (i % 5 === 0 || i === 0) {
                const label = document.createElement('div');
                label.className = `tick-label ${i === 0 ? 'zero' : ''}`;
                label.style.left = `${percent}%`;
                label.textContent = i;
                DOM.numberLine.appendChild(label);
            }
        }
    }

    function allowDrop(e) {
        e.preventDefault();
        DOM.dropZone.classList.add('drag-over');
    }

    function dragLeave(e) {
        DOM.dropZone.classList.remove('drag-over');
    }

    function drop(e) {
        e.preventDefault();
        DOM.dropZone.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        if (id) moveToDropZone(id);
    }

    function moveToDropZone(id) {
        if (state.placedVectors.length >= state.currentQuestion.terms.length) return; 
        const vecIndex = state.bankVectors.findIndex(v => v.id === id);
        if (vecIndex > -1) {
            const vec = state.bankVectors.splice(vecIndex, 1)[0];
            state.placedVectors.push(vec);
            refreshBankUI();
            renderPlacedVectors();
            checkRevealInput();
        }
    }

    function returnToBank(id) {
        const vecIndex = state.placedVectors.findIndex(v => v.id === id);
        if (vecIndex > -1) {
            const vec = state.placedVectors.splice(vecIndex, 1)[0];
            state.bankVectors.push(vec);
            refreshBankUI();
            renderPlacedVectors();
            checkRevealInput();
        }
    }

    function refreshBankUI() {
        DOM.vectorBank.innerHTML = '';
        state.bankVectors.forEach(vec => {
            DOM.vectorBank.appendChild(createArrowDOM(vec, true));
        });
    }

    function renderPlacedVectors() {
        DOM.dropZone.innerHTML = ''; 

        if (state.placedVectors.length === 0) {
            DOM.dropZone.textContent = "Drag all correct vectors here in order";
            return;
        }

        let currentPosition = 0;

        state.placedVectors.forEach((vec, index) => {
            const startVal = currentPosition;
            const endVal = currentPosition + vec.value;
            
            const widthPct = (Math.abs(vec.value) / TOTAL_RANGE) * 100;
            
            let leftPct;
            if (vec.value > 0) {
                leftPct = ((startVal - MIN_VAL) / TOTAL_RANGE) * 100;
            } else {
                leftPct = ((endVal - MIN_VAL) / TOTAL_RANGE) * 100;
            }

            const arrow = createArrowDOM(vec, false);
            arrow.style.width = `${widthPct}%`;
            arrow.style.left = `${leftPct}%`;
            
            // Adjust stacking height slightly if needed, but mainly z-index handles it.
            // All drop precisely at 72px so tips align perfectly with the number line
            arrow.style.top = `72px`; 
            
            DOM.dropZone.appendChild(arrow);
            currentPosition = endVal; 
        });
    }

    function checkRevealInput() {
        // Check if placed vectors match the required vectors EXACTLY to allow input
        if (state.placedVectors.length === state.currentQuestion.terms.length) {
            
            let requiredVals = state.currentQuestion.terms.map(t => t.vectorValue).sort((a,b) => a-b);
            let placedVals = state.placedVectors.map(v => v.value).sort((a,b) => a-b);
            
            let isCorrectVectors = true;
            for(let i=0; i < requiredVals.length; i++) {
                if(requiredVals[i] !== placedVals[i]) {
                    isCorrectVectors = false;
                    break;
                }
            }

            if(isCorrectVectors) {
                DOM.inputSection.classList.remove('hidden');
                DOM.dropZone.style.borderColor = '#22c55e'; // Highlight success
            } else {
                DOM.inputSection.classList.add('hidden');
                DOM.dropZone.style.borderColor = '#ef4444'; // Indicate incorrect vectors
            }
        } else {
            DOM.inputSection.classList.add('hidden');
            DOM.dropZone.style.borderColor = '#cbd5e1';
            clearInput();
        }
    }

    function inputNum(char) {
        if (char === '-') {
            if (state.inputValue === "") state.inputValue = "-";
            else if (state.inputValue === "-") state.inputValue = "";
        } else {
            if (state.inputValue.length < 4) state.inputValue += char;
        }
        updateInputDisplay();
    }

    function clearInput() {
        state.inputValue = "";
        updateInputDisplay();
    }

    function updateInputDisplay() {
        DOM.inputDisplay.textContent = state.inputValue;
    }

    function updateScoreDisplay() {
        document.getElementById('score-1').textContent = state.scores[1];
        document.getElementById('score-2').textContent = state.scores[2];
    }

    function checkAnswer() {
        if (state.inputValue === "" || state.inputValue === "-") return;

        const userAnswer = parseInt(state.inputValue, 10);
        
        if (userAnswer === state.currentQuestion.finalAnswer) {
            playCorrectSound();
            state.scores[state.level]++;
            updateScoreDisplay();

            if (state.scores[1] >= 10 && state.scores[2] >= 10) {
                triggerWinSequence();
                return;
            }

            DOM.modalTitle.textContent = "Correct! 🎉";
            DOM.modalTitle.className = "text-4xl font-black mb-4 text-green-500";
            DOM.modalMsg.textContent = "Great job finding the exact destination!";
            DOM.modal.classList.remove('hidden');
        } else {
            playWrongSound();
            state.scores[state.level] = Math.max(0, state.scores[state.level] - 1);
            updateScoreDisplay();

            DOM.modalTitle.textContent = "Oops! ❌";
            DOM.modalTitle.className = "text-4xl font-black mb-4 text-red-500";
            DOM.modalMsg.textContent = `That's incorrect. You arrived at ${userAnswer}, but the correct destination was ${state.currentQuestion.finalAnswer}.`;
            DOM.modal.classList.remove('hidden');
            
            clearInput();
        }
    }

    function triggerWinSequence() {
        DOM.winOverlay.classList.remove('hidden');
        
        document.querySelectorAll('.star').forEach(el => el.remove());

        const numStars = Math.floor(Math.random() * 20) + 25; 
        
        // Use inline SVG for high quality stars
        const starSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-full h-full text-yellow-400 drop-shadow-md"><path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd" /></svg>`;

        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.innerHTML = starSVG;
            
            // Random fixed positions across viewport
            star.style.top = `${Math.random() * 92}vh`;
            star.style.left = `${Math.random() * 92}vw`;
            
            const size = 30 + Math.random() * 40; // 30px to 70px
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            const rotation = Math.floor(Math.random() * 360);
            star.style.transform = `rotate(${rotation}deg)`;
            
            document.body.appendChild(star);
        }
    }

    function resetGame() {
        state.scores[1] = 0;
        state.scores[2] = 0;
        updateScoreDisplay();
        DOM.winOverlay.classList.add('hidden');
        document.querySelectorAll('.star').forEach(el => el.remove());
        startNewQuestion();
    }

    function nextQuestion() {
        DOM.modal.classList.add('hidden');
        startNewQuestion();
    }

    window.onload = init;

</script>
</body>
</html>
